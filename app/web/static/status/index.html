<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>Статус сервісів - Vartovyi</title>
  <script src="/static/status/status.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="lamp lamp--live" aria-hidden="true"></span>Vartovyi</a>
  </header>
  <main class="page status">
    <p class="muted status__eyebrow">Сторінка статусу</p>
    <h1 id="title" class="data-title">Статус сервісів</h1>

    <section id="banner" class="banner" role="status" aria-live="polite">
      <span class="lamp" id="banner-lamp" aria-hidden="true"></span>
      <span id="banner-text">Завантаження...</span>
    </section>

    <section aria-labelledby="monitors-heading">
      <h2 id="monitors-heading" class="visually-hidden">Сервіси</h2>
      <div class="status__cols muted" aria-hidden="true">
        <span></span><span>Сервіс</span><span>24 год</span><span>7 днів</span><span>30 днів</span>
      </div>
      <ul id="monitors" class="signals"></ul>
      <p id="empty" class="muted" hidden>На цій сторінці поки немає сервісів.</p>
    </section>

    <p class="muted refreshed" id="updated"></p>
  </main>

  <template id="monitor-template">
    <li class="signal status__row">
      <span class="lamp" aria-hidden="true"></span>
      <div class="signal__main">
        <span class="signal__name"></span>
        <span class="signal__state"></span>
      </div>
      <span class="data status__pct" data-window="uptime_24h"></span>
      <span class="data status__pct" data-window="uptime_7d"></span>
      <span class="data status__pct" data-window="uptime_30d"></span>
    </li>
  </template>
</body>
</html>
