<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Статус сервісів</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/status/status.css">
  <script src="/static/status/status.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="eyebrow">Сторінка статусу</p>
      <h1 id="title">Статус сервісів</h1>
    </header>

    <section id="banner" class="banner banner--loading" role="status" aria-live="polite">
      <span class="banner__dot" aria-hidden="true"></span>
      <span id="banner-text">Завантаження...</span>
    </section>

    <section aria-labelledby="monitors-heading">
      <h2 id="monitors-heading" class="visually-hidden">Сервіси</h2>
      <ul id="monitors" class="monitors"></ul>
      <p id="empty" class="muted" hidden>На цій сторінці поки немає сервісів.</p>
    </section>

    <footer class="footer muted">
      <span id="updated"></span>
      <span>Працює на Vartovyi</span>
    </footer>
  </main>

  <template id="monitor-template">
    <li class="monitor">
      <div class="monitor__head">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="monitor__name"></span>
        <span class="monitor__status"></span>
      </div>
      <dl class="uptime">
        <div class="uptime__item"><dt>24 год</dt><dd data-window="uptime_24h"></dd></div>
        <div class="uptime__item"><dt>7 днів</dt><dd data-window="uptime_7d"></dd></div>
        <div class="uptime__item"><dt>30 днів</dt><dd data-window="uptime_30d"></dd></div>
      </dl>
      <p class="monitor__checked muted"></p>
    </li>
  </template>
</body>
</html>
