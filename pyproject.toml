[project]
name = "vartovyi"
version = "0.1.0"
description = "Uptime and performance monitoring service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    # passlib 1.7.4 несумісний з bcrypt>=4.1 (падає на самоперевірці бекенду)
    "bcrypt>=4.0.1,<4.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Один event loop на сесію: пул asyncpg прив'язаний до циклу, в якому створений
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # passlib 1.7.4 імпортує модуль crypt, який застарів у Python 3.12
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "types-passlib>=1.7.7.20260211",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async перемикає greenlet-и, без цього coverage губить рядки після await
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
